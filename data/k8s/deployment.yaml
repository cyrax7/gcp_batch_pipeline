apiVersion: batch/v1
kind: CronJob
metadata:
  name: gcp-batch-pipeline-data-generator
  namespace: default
  labels:
    app: gcp-batch-pipeline-data-generator

spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: gcp-batch-pipeline-data-generator
        spec:
          serviceAccountName: data-generator-ksa
          restartPolicy: OnFailure

          containers:
          - name: gcp-batch-pipeline-data-generator

            image: {{CRONJOB_IMAGE_URI}}:{{SHORT_SHA}}
            imagePullPolicy: Always

            resources:
              requests:
                cpu: "250m"
                memory: "512Mi"
              limits:
                cpu: "500m"
                memory: "1Gi"

            env:
              - name: GCS_BUCKET
                value: "{{GCS_BUCKET}}"
              - name: GCS_PREFIX
                value: "{{GCS_PREFIX}}"
