logsBucket: gs://YOUR_GCS_BUCKET/cloudbuild-logs
serviceAccount: projects/YOUR_PROJECT_ID/serviceAccounts/YOUR_SERVICE_ACCOUNT_NAME@YOUR_PROJECT_ID.iam.gserviceaccount.com

substitutions:
  _REGION: "us-central1"
  _PROJECT_ID: "YOUR_PROJECT_ID"
  _REPO: "YOUR_AR_REPO_NAME"
  _SERVICE_NAME: "gcp-batch-pipeline-data-generator"
  _GCS_BUCKET: "YOUR_GCS_BUCKET"
  _GCS_PREFIX: "synthetic_data"

steps:
  # ==============================================================================
  # Phase 1: Build and Push Docker Image
  # ==============================================================================

  - name: "gcr.io/cloud-builders/docker"
    id: Build Data Generator Image
    waitFor: ["-"]
    args:
      - "build"
      - "--no-cache"
      - "-f"
      - "Dockerfile"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: Push Data Generator Image
    waitFor: ["Build Data Generator Image"]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:$SHORT_SHA"

  # ==============================================================================
  # Phase 2: Deploy to Cloud Run
  # ==============================================================================

  - name: "gcr.io/cloud-builders/gcloud"
    id: Deploy to Cloud Run
    waitFor: ["Push Data Generator Image"]
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--service-account=YOUR_SERVICE_ACCOUNT_NAME@${_PROJECT_ID}.iam.gserviceaccount.com"
      - "--set-env-vars=GCS_BUCKET=${_GCS_BUCKET},GCS_PREFIX=${_GCS_PREFIX}"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--timeout=540"
      - "--max-instances=1"
      - "--concurrency=1"
